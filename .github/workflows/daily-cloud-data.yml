name: Cloud Daily Taiwan Stock OHLCV
on:
  workflow_dispatch:
  schedule:
    - cron: '7 17,19,23 * * 1-5'
      timezone: 'Asia/Taipei'
    - cron: '15 7 * * 1-5'
      timezone: 'Asia/Taipei'
    - cron: '5 8 * * 1-5'
      timezone: 'Asia/Taipei'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: tw-market-data-publish
  cancel-in-progress: false
jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run collector unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Fetch latest government open data and update dated archives
        run: python3 collect_market.py
      - name: Commit verified public dataset only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/market-index.json docs/daily/
          if ! git diff --cached --quiet; then
            git commit -m 'data: update verified daily OHLCV snapshots'
            git push
          else
            echo 'No data changes.'
          fi
      # A commit made with GITHUB_TOKEN does NOT trigger a separate Pages
      # branch build. Deploy directly from this scheduled workflow instead.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload current data and index as GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish GitHub Pages now
        id: deployment
        uses: actions/deploy-pages@v4
